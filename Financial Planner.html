<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Financial Planner</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <!-- Load constants first (plain JS) -->
  <script src="planner/constants.js"></script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      background: #060606;
      color: #f0f0f0;
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #0f0f0f; }
    ::-webkit-scrollbar-thumb { background: #2a2a2a; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #c9a435; }

    select, input, button { font-family: 'Inter', sans-serif; }
    select option { background: #171717; color: #f0f0f0; }

    @keyframes spin {
      from { transform: rotate(0deg); }
      to   { transform: rotate(360deg); }
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes fadeIn {
      from { opacity: 0; }
      to   { opacity: 1; }
    }

    /* Gold scrollbar accent line at top */
    body::before {
      content: '';
      position: fixed;
      top: 0; left: 0; right: 0;
      height: 2px;
      background: linear-gradient(90deg, #c9a435, #e8c96f, #c9a435);
      z-index: 9999;
    }

    /* API key modal overlay */
    .modal-overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.85);
      display: flex; align-items: center; justify-content: center;
      z-index: 1000;
      animation: fadeIn 0.2s ease-out;
    }

    input[type=range] {
      -webkit-appearance: none;
      appearance: none;
      height: 4px;
      border-radius: 2px;
      background: #272727;
      outline: none;
    }
    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 18px; height: 18px;
      border-radius: 50%;
      background: #c9a435;
      cursor: pointer;
      box-shadow: 0 0 8px rgba(201,164,53,0.5);
    }
    input[type=range]::-moz-range-thumb {
      width: 18px; height: 18px;
      border-radius: 50%;
      background: #c9a435;
      cursor: pointer;
      border: none;
    }
  </style>

  <!-- Load JSX components via Babel -->
  <script type="text/babel" src="planner/Charts.jsx"></script>
  <script type="text/babel" src="planner/FormScreen.jsx"></script>
  <script type="text/babel" src="planner/LoadingScreen.jsx"></script>
  <script type="text/babel" src="planner/ResultsScreen.jsx"></script>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useCallback } = React;

    // ── API Key Management ─────────────────────────────────────────────────────
    function getStoredKey() {
      return localStorage.getItem('fp_openai_key') || '';
    }

    function ApiKeyModal({ onSave }) {
      const [val, setVal] = useState('');
      const [err, setErr] = useState('');
      function save() {
        const k = val.trim();
        if (!k.startsWith('sk-')) { setErr('Key must start with "sk-"'); return; }
        localStorage.setItem('fp_openai_key', k);
        onSave(k);
      }
      const inp = {
        width: '100%', padding: '12px 14px', background: C.surface2,
        border: `1px solid ${C.border}`, borderRadius: 2, color: C.text,
        fontSize: 14, fontFamily: FONT.sans, outline: 'none', marginBottom: 8,
      };
      return (
        <div className="modal-overlay">
          <div style={{ background: C.surface, border: `1px solid ${C.border}`, borderRadius: 4, padding: 40, maxWidth: 440, width: '90%' }}>
            <div style={{ display: 'flex', alignItems: 'center', gap: 12, marginBottom: 24 }}>
              <div style={{ width: 36, height: 36, background: C.gold, borderRadius: 2, display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
                <span style={{ color: '#000', fontWeight: 800, fontSize: 16 }}>FP</span>
              </div>
              <h2 style={{ fontFamily: FONT.serif, fontSize: 22, color: C.text, fontWeight: 400 }}>Enter your API key</h2>
            </div>
            <p style={{ fontSize: 13, color: C.textSub, fontFamily: FONT.sans, marginBottom: 20, lineHeight: 1.6 }}>
              This app uses the OpenAI API to generate personalised portfolio recommendations. Your key is stored only in your browser (localStorage) and never sent anywhere else.
            </p>
            <input
              type="password"
              value={val}
              onChange={e => setVal(e.target.value)}
              onKeyDown={e => e.key === 'Enter' && save()}
              placeholder="sk-..."
              style={inp}
            />
            {err && <p style={{ fontSize: 12, color: C.red, marginBottom: 8, fontFamily: FONT.sans }}>{err}</p>}
            <button
              onClick={save}
              style={{ width: '100%', padding: 14, background: C.gold, color: '#000', border: 'none', borderRadius: 2, fontSize: 14, fontWeight: 700, cursor: 'pointer', fontFamily: FONT.sans }}
            >Save &amp; continue</button>
            <p style={{ fontSize: 11, color: C.textMuted, fontFamily: FONT.sans, marginTop: 14, textAlign: 'center' }}>
              You can update or clear your key at any time via the settings button.
            </p>
          </div>
        </div>
      );
    }

    // ── OpenAI call ────────────────────────────────────────────────────────────
    async function fetchPortfolio(formData, apiKey) {
      const prompt = buildPrompt(formData);
      const resp = await fetch('https://api.openai.com/v1/chat/completions', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${apiKey}` },
        body: JSON.stringify({
          model: 'gpt-4o-mini',
          messages: [{ role: 'user', content: prompt }],
          temperature: 0.7,
          max_tokens: 4096,
          response_format: { type: 'json_object' },
        }),
      });
      if (!resp.ok) {
        const err = await resp.json().catch(() => ({}));
        throw new Error(err?.error?.message || `API error ${resp.status}`);
      }
      const json = await resp.json();
      const content = json.choices?.[0]?.message?.content;
      if (!content) throw new Error('Empty response from API');
      return JSON.parse(content);
    }

    // ── Root App ───────────────────────────────────────────────────────────────
    function App() {
      const [screen, setScreen] = useState('form'); // form | loading | results | error
      const [apiKey, setApiKey] = useState(getStoredKey);
      const [showKeyModal, setShowKeyModal] = useState(!getStoredKey());
      const [formData, setFormData] = useState(null);
      const [portfolioData, setPortfolioData] = useState(null);
      const [errorMsg, setErrorMsg] = useState('');

      async function handleFormSubmit(fd) {
        if (!apiKey) { setShowKeyModal(true); return; }
        setFormData(fd);
        setScreen('loading');
        setErrorMsg('');
        try {
          const data = await fetchPortfolio(fd, apiKey);
          // Ensure colors assigned if missing
          if (data.holdings) {
            data.holdings = data.holdings.map((h, i) => ({
              ...h,
              color: h.color || SLICE_COLORS[i % SLICE_COLORS.length],
              amount: h.amount || Math.round(fd.amount * h.allocation / 100),
            }));
          }
          setPortfolioData(data);
          setScreen('results');
        } catch (e) {
          setErrorMsg(e.message || 'Unknown error');
          setScreen('error');
        }
      }

      function handleReset() {
        setScreen('form');
        setPortfolioData(null);
        setFormData(null);
        setErrorMsg('');
      }

      // Settings button (shown on form screen)
      const SettingsBtn = () => (
        <button
          onClick={() => setShowKeyModal(true)}
          style={{
            position: 'fixed', bottom: 24, right: 24,
            padding: '8px 14px', background: C.surface, border: `1px solid ${C.border}`,
            borderRadius: 2, color: C.textSub, fontSize: 12, fontFamily: FONT.sans,
            cursor: 'pointer', display: 'flex', alignItems: 'center', gap: 6, zIndex: 100,
          }}
        >
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
            <circle cx="12" cy="12" r="3"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>
          </svg>
          API Key
        </button>
      );

      return (
        <div style={{ animation: 'fadeIn 0.3s ease-out' }}>
          {showKeyModal && (
            <ApiKeyModal onSave={k => { setApiKey(k); setShowKeyModal(false); }} />
          )}

          {screen === 'form' && (
            <>
              <FormScreen onSubmit={handleFormSubmit} />
              <SettingsBtn />
            </>
          )}

          {screen === 'loading' && <LoadingScreen formData={formData} />}

          {screen === 'results' && portfolioData && (
            <ResultsScreen data={portfolioData} formData={formData} onReset={handleReset} />
          )}

          {screen === 'error' && (
            <div style={{ minHeight: '100vh', display: 'flex', alignItems: 'center', justifyContent: 'center', padding: 24 }}>
              <div style={{ background: C.surface, border: `1px solid #3a1a1a`, borderRadius: 4, padding: '40px 48px', maxWidth: 480, width: '100%', textAlign: 'center' }}>
                <div style={{ fontSize: 40, marginBottom: 16 }}>⚠</div>
                <h2 style={{ fontFamily: FONT.serif, fontSize: 22, color: C.text, marginBottom: 12 }}>Something went wrong</h2>
                <p style={{ fontSize: 13, color: C.textSub, fontFamily: FONT.sans, marginBottom: 8, lineHeight: 1.6 }}>{errorMsg}</p>
                <p style={{ fontSize: 12, color: C.textMuted, fontFamily: FONT.sans, marginBottom: 28 }}>Check your API key is valid and has sufficient credits.</p>
                <div style={{ display: 'flex', gap: 12, justifyContent: 'center' }}>
                  <button onClick={() => setShowKeyModal(true)} style={{ padding: '10px 20px', background: 'transparent', border: `1px solid ${C.border}`, borderRadius: 2, color: C.textSub, fontSize: 13, fontFamily: FONT.sans, cursor: 'pointer' }}>Update API Key</button>
                  <button onClick={handleReset} style={{ padding: '10px 20px', background: C.gold, border: 'none', borderRadius: 2, color: '#000', fontSize: 13, fontWeight: 700, fontFamily: FONT.sans, cursor: 'pointer' }}>Try again</button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
